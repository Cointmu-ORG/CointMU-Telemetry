# /etc/tmpfiles.d/cointmu-watchdog.conf, applied with systemd-tmpfiles --create (and
# at every boot). The metrics folder is read by scope infra's textfile glob;
# setgid, so Alloy can read the file (group alloy).
d /var/lib/cointmu-watchdog 0700 cointmu-watchdog cointmu-watchdog -
d /var/lib/cointmu-infra 0755 root root -
d /var/lib/cointmu-infra/watchdog 2750 cointmu-watchdog alloy -
