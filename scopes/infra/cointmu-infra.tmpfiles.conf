# /etc/tmpfiles.d/cointmu-infra.conf, applied with systemd-tmpfiles --create (and
# at every boot). One folder per collector. setgid: files written there get
# group alloy, so the Alloy agent can read them.
d /var/lib/cointmu-infra 0755 root root -
d /var/lib/cointmu-infra/smart 2750 root alloy -
d /var/lib/cointmu-infra/pve 2750 root alloy -
d /var/lib/cointmu-infra/gpu 2750 cointmu-infra alloy -
