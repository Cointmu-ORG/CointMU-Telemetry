# GlitchTip (Sentry-protocol error collector) for CointMU, behind a TLS proxy.
# Only the proxy is published, and only on the campus LAN address (BIND_IP).

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/glitchtip
  SECRET_KEY: ${SECRET_KEY:?set in .env}
  # Postgres also serves as task queue and cache, so no Valkey container.
  VALKEY_URL: ""
  SERVER_ROLE: all_in_one
  GLITCHTIP_DOMAIN: https://${GLITCHTIP_HOST:?set in .env}:${HTTPS_PORT:-443}
  ALLOWED_HOSTS: ${GLITCHTIP_HOST},localhost
  CSRF_TRUSTED_ORIGINS: https://${GLITCHTIP_HOST},https://${GLITCHTIP_HOST}:${HTTPS_PORT:-443}
  # No mail relay on the LAN; invitation mails are printed to the log.
  EMAIL_URL: consolemail://
  DEFAULT_FROM_EMAIL: glitchtip@localhost
  ENABLE_USER_REGISTRATION: "False"
  ENABLE_ORGANIZATION_CREATION: "False"
  ENABLE_ADMIN: "False"
  ENABLE_OPENAPI: "False"
  GLITCHTIP_ENABLE_LOGS: "False"
  GLITCHTIP_ENABLE_UPTIME: "False"
  GLITCHTIP_ENABLE_MCP: "False"
  GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-60}
  # Second line of defence after the app's own sanitizer: server-side PII
  # scrubbing for every project (keys below plus GlitchTip's defaults).
  GLITCHTIP_PII_SCRUB_DEFAULT: >-
    {"enabled": true, "scrub_emails": true, "sensitive_keys":
    ["mnemonic", "seed", "phrase", "password", "passphrase", "private_key",
    "privateKey", "signed_transaction", "rawTransaction", "keystore"]}

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine
    # The entrypoint chowns the data dir and drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
    networks: [backend]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "glitchtip", "-d", "glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    <<: *hardening
    image: glitchtip/glitchtip:6.2.6
    environment: *glitchtip-env
    volumes:
      - uploads:/code/uploads
    networks: [backend, frontend]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  proxy:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.31.7-alpine
    ports:
      - "${BIND_IP:?set in .env}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # nginx (UID 101) reads certs/server.key through this dedicated host group.
    group_add: ["${TLS_GID:?set in .env}"]
    read_only: true
    tmpfs: [/tmp]
    networks: [frontend]
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 64m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/_health/"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  # Postgres has no route outside the host.
  backend:
    internal: true
  frontend: {}

volumes:
  pg-data:
  uploads:
