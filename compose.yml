# GlitchTip (Sentry-protocol error collector) for CointMU, behind a TLS proxy.
# Only the proxy is published, and only on the campus LAN address (BIND_IP).
# Images are pinned as tag@digest: Docker pulls by digest, the tag says which
# release it is and lets Dependabot propose the next one (tag and digest).

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# Rotated per container so logs cannot fill the disk (3 x 10 MB each; the
# proxy keeps more, see there).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/glitchtip
  SECRET_KEY: ${SECRET_KEY:?set in .env}
  # Postgres also serves as task queue and cache, so no Valkey container.
  VALKEY_URL: ""
  SERVER_ROLE: all_in_one
  GLITCHTIP_DOMAIN: https://${GLITCHTIP_HOST:?set in .env}:${HTTPS_PORT:-443}
  ALLOWED_HOSTS: ${GLITCHTIP_HOST},localhost
  CSRF_TRUSTED_ORIGINS: https://${GLITCHTIP_HOST},https://${GLITCHTIP_HOST}:${HTTPS_PORT:-443}
  # No mail relay on the LAN; invitation mails are printed to the log.
  EMAIL_URL: consolemail://
  DEFAULT_FROM_EMAIL: glitchtip@localhost
  ENABLE_USER_REGISTRATION: "False"
  ENABLE_ORGANIZATION_CREATION: "False"
  ENABLE_ADMIN: "False"
  ENABLE_OPENAPI: "False"
  GLITCHTIP_ENABLE_LOGS: "False"
  GLITCHTIP_ENABLE_UPTIME: "False"
  GLITCHTIP_ENABLE_MCP: "False"
  GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-60}
  # Second line of defence after the app's own sanitizer: server-side PII
  # scrubbing for every project (keys below plus GlitchTip's defaults).
  GLITCHTIP_PII_SCRUB_DEFAULT: >-
    {"enabled": true, "scrub_emails": true, "sensitive_keys":
    ["mnemonic", "seed", "phrase", "password", "passphrase", "private_key",
    "privateKey", "signed_transaction", "rawTransaction", "keystore"]}

services:
  postgres:
    <<: [*hardening, *logging]
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # The entrypoint chowns the data dir and drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
    networks: [backend]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "glitchtip", "-d", "glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    <<: [*hardening, *logging]
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    environment: *glitchtip-env
    volumes:
      - uploads:/code/uploads
    networks: [backend, frontend]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # The image is distroless (no shell, no wget), so there is no in-container
  # healthcheck; RUNBOOK.md checks /ready through the grafana container.
  loki:
    <<: [*hardening, *logging]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-720h}
      # Go GC works harder before mem_limit is hit instead of being OOM-killed.
      GOMEMLIMIT: 600MiB
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    read_only: true
    tmpfs: [/tmp]
    networks: [logs]
    mem_limit: 768m
    pids_limit: 200

  # Metrics pushed by host agents (README.md, "UPS monitoring"): the proxy
  # passes POST /prometheus/api/v1/write through and nothing else, so the query
  # API is reachable from Grafana only. No scrape targets of its own.
  prometheus:
    <<: [*hardening, *logging]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      # Whichever limit is reached first deletes the oldest data.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-90d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    environment:
      # Go GC works harder before mem_limit is hit instead of being OOM-killed.
      GOMEMLIMIT: 300MiB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs: [/tmp]
    networks: [logs]
    mem_limit: 384m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Served by the proxy at /grafana/ to the admin allowlist only.
  grafana:
    <<: [*hardening, *logging]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      # Applied only when the database is first created; RUNBOOK.md rotates it.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SERVER_ROOT_URL: https://${GLITCHTIP_HOST}:${HTTPS_PORT:-443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Login form only; no HTTP basic auth against the API.
      GF_AUTH_BASIC_ENABLED: "false"
      # No websockets through the proxy; dashboards refresh instead.
      GF_LIVE_MAX_CONNECTIONS: "0"
      # Its only route out is alerts-egress, for the Discord webhook: no phoning
      # home, no plugin downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # One login per admin (RUNBOOK.md, "Grafana users"); new users can only
      # read dashboards until an admin gives them more.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      # #node-logs webhook for grafana/provisioning/alerting/contact-points.yml.
      # Grafana refuses an empty Discord URL, so "off" (empty in .env) becomes
      # an address on the reserved .invalid domain that can never resolve.
      DISCORD_WEBHOOK_NODE_LOGS: ${DISCORD_WEBHOOK_NODE_LOGS:-https://discord.invalid/webhook-not-configured}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs: [/tmp]
    networks: [logs, alerts-egress]
    depends_on:
      loki: { condition: service_started }
      prometheus: { condition: service_started }
    mem_limit: 512m
    # Grafana runs some bundled data sources as plugin processes; at 100 it
    # failed to create threads ("newosproc") on first start.
    pids_limit: 300
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start runs all database migrations (about 2 minutes on a slow disk).
      start_period: 180s

  proxy:
    <<: [*hardening, *logging]
    # Its access log is the admin audit trail (README.md, "IP addresses"), so it
    # is kept much longer: 30 x 100 MB is at least 30 days at the worst-case
    # push volume (5 agents, one push a second). Rotated files are gzipped
    # (about a tenth on disk); docker compose logs still reads them.
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "30"
        compress: "true"
    image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    ports:
      - "${BIND_IP:?set in .env}:${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Per-host allowlists and agent logins (git-ignored). A folder, not single
      # files, so edits show up after "nginx -s reload" whatever the editor does.
      - type: bind
        source: ./nginx/local
        target: /etc/nginx/local
        read_only: true
        bind: { create_host_path: false }
      # Refuses to start while a file in nginx/local/ is missing.
      - ./nginx/require-local.sh:/docker-entrypoint.d/05-require-local.sh:ro
      - ./certs:/etc/nginx/certs:ro
    # nginx (UID 101) reads certs/server.key through this dedicated host group.
    group_add: ["${TLS_GID:?set in .env}"]
    read_only: true
    tmpfs: [/tmp]
    networks: [frontend, logs]
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 64m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/_health/"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  # Postgres has no route outside the host.
  backend:
    internal: true
  frontend: {}
  # Loki, Prometheus and Grafana: reachable only from the proxy, no route out,
  # no Postgres.
  logs:
    internal: true
  # Grafana's route out, for the Discord webhook only; Loki and Prometheus are
  # not on it.
  # Docker cannot limit it to discord.com: the VM firewall decides
  # (README.md, "Alerts").
  alerts-egress: {}

volumes:
  pg-data:
  uploads:
  loki-data:
  prometheus-data:
  grafana-data:
