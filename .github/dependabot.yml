version: 2
updates:
  # compose.yml images (tag@digest pins): one PR per new tag or rebuilt digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuses to run when init and analyze are on different versions,
      # so they have to be bumped in the same PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
