version: 2
updates:
  # compose.yml images (tag@digest pins): one PR for all new tags and rebuilt digests.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all actions.
      actions:
        patterns: ["*"]
