# /etc/tmpfiles.d/cointmu-chain.conf on a geth node server, applied with
# systemd-tmpfiles --create (and at every boot). Needs the cointmu-chain user
# and the alloy group (agents/chain/README.md).
# setgid: files chain-metrics.py writes here get group alloy, so the Alloy
# agent can read them while cointmu-chain is not in group alloy (that group can
# read /etc/alloy/*-password).
d /var/lib/cointmu-chain 2750 cointmu-chain alloy -
