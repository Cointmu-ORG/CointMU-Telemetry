# /etc/tmpfiles.d/cointmu-ups.conf on the UPS host, applied with
# systemd-tmpfiles --create (and at every boot). Needs the cointmu-ups user and
# the alloy group (install Alloy first, agents/ups/README.md).
# setgid: files ups-metrics.sh writes here get group alloy, so the Alloy agent
# can read them while cointmu-ups is not in group alloy (that group can read
# /etc/alloy/*-password).
d /var/lib/cointmu-ups 2750 cointmu-ups alloy -
