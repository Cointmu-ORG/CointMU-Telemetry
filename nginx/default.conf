# TLS front for GlitchTip. Clients are identified to GlitchTip only as this
# proxy: forwarding headers are cleared and the access log has no client IP.

# Per-client limit on event ingest (kept in memory only, never logged).
limit_req_zone $binary_remote_addr zone=ingest:10m rate=5r/s;
limit_req_status 429;

log_format noip '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
  listen 8443 ssl;
  http2 on;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:1m;

  access_log /dev/stdout noip;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Real-IP "";
  proxy_set_header Forwarded "";

  # Sentry-protocol ingest. The app strips attachments, so events are small.
  location ~ ^/api/[0-9]+/(envelope|store)/$ {
    limit_req zone=ingest burst=20 nodelay;
    client_max_body_size 1m;
    proxy_pass http://web:8000;
  }

  # Liveness only (no data), open to the LAN like ingest.
  location = /_health/ {
    proxy_pass http://web:8000;
  }

  # Dashboard and API: admin addresses only (admin-allow.conf, not in git).
  location / {
    include /etc/nginx/admin-allow.conf;
    deny all;
    client_max_body_size 10m;
    proxy_pass http://web:8000;
  }
}
