# TLS front for GlitchTip, the push endpoints for the host agents (Loki logs,
# Prometheus metrics), and Grafana. Upstreams see clients only as this proxy: forwarding headers
# are cleared. The access log has no client IP, except for the audit trail of
# the admin paths and of failed log pushes (log_format audit below).

# Per-client limit on event ingest (kept in memory only, never logged).
limit_req_zone $binary_remote_addr zone=ingest:10m rate=5r/s;
# Per-agent limit on log pushes. Alloy sends about one batch a second, more
# while it drains its disk buffer after an outage.
limit_req_zone $binary_remote_addr zone=logpush:10m rate=10r/s;
# Per-agent limit on metric pushes. Alloy sends a batch every few seconds at a
# 15 s scrape interval, more while it replays its WAL after an outage.
limit_req_zone $binary_remote_addr zone=metricpush:10m rate=5r/s;
limit_req_status 429;

# Docker's DNS, so Loki, Prometheus and Grafana are looked up per request: the
# proxy (and GlitchTip ingest) keeps running while any of them is down.
resolver 127.0.0.11 valid=30s ipv6=off;

# Addresses the host agents (geth nodes, the UPS host) may push logs and
# metrics from (agent-allow.conf). A geo map rather than allow/deny, because
# nginx checks auth_basic before allow/deny: everyone else gets 403 before any
# login prompt.
geo $is_log_agent {
  default 0;
  include /etc/nginx/local/agent-allow.conf;
}

# Default for everything, including event ingest and /_health/: no client
# address, no query string.
log_format noip '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# Audit trail of who reached the admin paths (GlitchTip dashboard and API,
# Grafana) and of failed log and metric pushes, with the agent login. Used only
# in those locations, each request in exactly one of the two formats:
# - admin paths: allowed requests here; 403s (campus laptops not on the
#   allowlist) stay in noip, so students' addresses are never logged;
# - log and metric push: 401/413/429/5xx here; successful pushes and 403s stay
#   in noip.
log_format audit '$remote_addr $remote_user [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

map $status $admin_audit {
  403 0;
  default 1;
}
map $status $admin_noip {
  403 1;
  default 0;
}
map $status $push_audit {
  "~^(401|413|429|5[0-9][0-9])$" 1;
  default 0;
}
map $status $push_noip {
  "~^(401|413|429|5[0-9][0-9])$" 0;
  default 1;
}

server {
  listen 8443 ssl;
  http2 on;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:1m;

  access_log /dev/stdout noip;
  # nginx's error log names the client on almost every line (denied admin
  # requests, rate-limited ingest, upstream failures), so only critical errors
  # are logged: rare TLS failures, which do include the client address. The
  # status codes stay in the access log. RUNBOOK.md ("Reports are not
  # arriving") raises this to error for a short debugging session.
  error_log /dev/stderr crit;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Real-IP "";
  proxy_set_header Forwarded "";
  # Loki runs single-tenant; never let a pusher pick another tenant.
  proxy_set_header X-Scope-OrgID "";

  # Sentry-protocol ingest. The app strips attachments, so events are small.
  location ~ ^/api/[0-9]+/(envelope|store)/$ {
    limit_req zone=ingest burst=20 nodelay;
    client_max_body_size 1m;
    proxy_pass http://web:8000;
  }

  # Liveness only (no data), open to the LAN like ingest.
  location = /_health/ {
    proxy_pass http://web:8000;
  }

  # Log push from the geth node agents: their addresses only (agent-allow.conf)
  # and a per-agent login (loki-agents.htpasswd), both in nginx/local/.
  location = /loki/api/v1/push {
    access_log /dev/stdout audit if=$push_audit;
    access_log /dev/stdout noip if=$push_noip;
    # Only agent addresses reach the error-level lines (failed logins,
    # rejected bursts, Loki down): everyone else gets the 403 below, which
    # logs no error.
    error_log /dev/stderr error;
    if ($is_log_agent = 0) {
      return 403;
    }
    auth_basic "loki push";
    auth_basic_user_file /etc/nginx/local/loki-agents.htpasswd;
    # Delay rather than reject bursts; Alloy batches are at most 1 MiB.
    limit_req zone=logpush burst=50;
    client_max_body_size 2m;
    set $loki http://loki:3100;
    proxy_pass $loki;
  }

  # Loki's query API is for Grafana on the internal network only.
  location /loki/ {
    return 404;
  }

  # Metric push (Prometheus remote write) from the host agents: the same
  # address list as the log push, but its own logins (metrics-agents.htpasswd),
  # so a log login cannot write metrics and the other way round.
  location = /prometheus/api/v1/write {
    access_log /dev/stdout audit if=$push_audit;
    access_log /dev/stdout noip if=$push_noip;
    error_log /dev/stderr error;
    if ($is_log_agent = 0) {
      return 403;
    }
    auth_basic "metrics push";
    auth_basic_user_file /etc/nginx/local/metrics-agents.htpasswd;
    # Alloy sends at most 2000 samples per request, well under 1 MiB
    # compressed.
    limit_req zone=metricpush burst=20;
    client_max_body_size 1m;
    set $prometheus http://prometheus:9090;
    proxy_pass $prometheus/api/v1/write;
  }

  # Prometheus' query API and UI are for Grafana on the internal network only.
  location /prometheus/ {
    return 404;
  }

  # Grafana: admin addresses only, same list as the GlitchTip dashboard.
  location = /grafana {
    return 301 /grafana/;
  }
  location ^~ /grafana/ {
    access_log /dev/stdout audit if=$admin_audit;
    access_log /dev/stdout noip if=$admin_noip;
    include /etc/nginx/local/admin-allow.conf;
    deny all;
    set $grafana http://grafana:3000;
    proxy_pass $grafana;
  }

  # Dashboard and API: admin addresses only (admin-allow.conf, not in git).
  location / {
    access_log /dev/stdout audit if=$admin_audit;
    access_log /dev/stdout noip if=$admin_noip;
    include /etc/nginx/local/admin-allow.conf;
    deny all;
    client_max_body_size 10m;
    proxy_pass http://web:8000;
  }
}
