# Alert rules on the geth node logs, sent to #node-logs (policies.yml), on
# the UPS metrics (group ups below), sent to #ups, and on the chain metrics
# (group chain below), sent to #block-update. Every geth query skips
# host="redaction-check-*", the test lines that agents/alloy/check-redaction.sh
# pushes. Literal "$" in this file would be read as an environment variable.
#
# Each geth rule is A (Loki, instant query) -> B (last value per series) -> C
# (threshold on B, the condition). The message shows B as the count.
apiVersion: 1
groups:
  - orgId: 1
    name: node-logs
    folder: Node logs
    interval: 1m
    rules:
      # A host that logged in the last 24 hours but not in the last 15 minutes.
      # geth at INFO logs every few seconds, so 15 minutes of silence means the
      # node, geth or its agent stopped. A host that is shut down on purpose
      # keeps firing until it drops out of the 24 hours: silence it
      # (RUNBOOK.md). No data means no silent host (OK). On a query error the
      # rule keeps its last state, so a Loki outage neither resolves nor raises
      # it; "Loki unreachable or no logs" reports the outage instead.
      - uid: geth-host-silent
        title: Host silent
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          count_meaning: lines in the last 24 h, none in the last 15 min
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum by (host) (count_over_time({job="geth", host!~"redaction-check-.*"}[24h]))
                unless
                sum by (host) (count_over_time({job="geth", host!~"redaction-check-.*"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # Any fatal or crit line from geth. Resolves once 5 minutes pass without
      # one; keeps its last state while Loki does not answer.
      - uid: geth-fatal-crit
        title: Fatal or crit line
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        annotations:
          count_meaning: fatal/crit lines in the last 5 min
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum by (host) (count_over_time({job="geth", level=~"fatal|crit", host!~"redaction-check-.*"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # Loki does not answer (query error) or no host sent anything for 15
      # minutes. This is the one alert for a log stack outage; it also fires on
      # a fresh deployment until the first agent ships logs. 5 minutes pending
      # so a Loki restart or upgrade does not page.
      - uid: loki-unreachable-or-empty
        title: Loki unreachable or no logs
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          count_meaning: 'lines from all hosts in the last 15 min ("-": Loki did not answer or nothing arrived)'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({job="geth", host!~"redaction-check-.*"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  # UPS metrics from the UPS host (agents/ups/), sent to #ups (policies.yml,
  # label source=ups). The host posts every power event itself (on battery,
  # back on mains, low battery, shutdown) within 30 s; these rules add only
  # what needs a threshold or what the host cannot report about itself, so
  # nothing is posted twice. Each rule is A (Prometheus, instant) -> B (last
  # value per series) -> C (threshold on B); the message shows B.
  - orgId: 1
    name: ups
    folder: UPS
    interval: 1m
    rules:
      # A long outage: the host posted "ON BATTERY" already; this says the
      # battery is now what keeps the host and the telemetry VM up.
      - uid: ups-on-battery-long
        title: UPS on battery for 10 min
        condition: C
        for: 10m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: ups }
        annotations:
          value_meaning: "(1 = on battery)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'max by (host, ups) (ups_status{job="ups", flag="OB"})' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      # The charge of this UPS (nutdrv_qx) is estimated from the battery
      # voltage, which sags under load: it can drop below 50 % soon after the
      # outage starts. Runtime (next rule) is the better signal.
      - uid: ups-charge-low
        title: UPS charge below 50 %
        condition: C
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: ups }
        annotations:
          value_meaning: "% battery charge (limit 50)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'min by (host, ups) (ups_battery_charge_percent{job="ups"})' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [50] } }]

      # The UPS reports no battery.runtime.low and upsmon runs monitor-only, so
      # nothing shuts down by itself: 15 min leaves time to shut the telemetry
      # VM and the host down by hand (RUNBOOK.md, "UPS runtime below 15 min")
      # before the UPS's own low-battery flag.
      - uid: ups-runtime-low
        title: UPS runtime below 15 min
        condition: C
        for: 1m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: ups }
        annotations:
          value_meaning: "min of runtime left (limit 15)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'min by (host, ups) (ups_battery_runtime_seconds{job="ups"}) / 60' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [15] } }]

      # upsc fails on the host: upsd down, driver not connected or its data
      # stale (USB cable, driver crash). The host's own "COMM LOST" covers the
      # same from upsmon's side.
      - uid: ups-unreadable
        title: UPS unreadable
        condition: C
        for: 2m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: ups }
        annotations:
          value_meaning: "(0 = upsc cannot read the UPS)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'min by (host, ups) (ups_up{job="ups"})' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # Fresh scrapes of old content: ups-metrics.sh or its timer stopped, and
      # Alloy keeps sending the last file (ups_up stays 1). The sample's own
      # time minus the time written into it; during a network or Alloy outage
      # the last sample only ages and the difference stays small, so only
      # "UPS data missing" fires then. No data means OK for the same reason.
      - uid: ups-metrics-stale
        title: UPS metrics stale
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: ups }
        annotations:
          value_meaning: "s between the scrape and the file's content (limit 60)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                max by (host, ups) (timestamp(ups_scrape_timestamp_seconds{job="ups"})
                - ups_scrape_timestamp_seconds{job="ups"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [60] } }]

      # No UPS sample at all for 5 minutes: the UPS host, its Alloy, or the
      # network between it and this VM is down (or this VM was, see
      # README.md "Blind spot"). Also fires on a fresh deployment until the
      # UPS host ships metrics. While Prometheus does not answer it keeps its
      # last state; healthcheck.sh reports Prometheus itself to #infra.
      - uid: ups-data-missing
        title: UPS data missing
        condition: C
        for: 0m
        noDataState: Alerting
        execErrState: KeepLast
        labels: { source: ups }
        annotations:
          value_meaning: 'UPS series in the last 5 min ("-": none arrived)'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'count(last_over_time(ups_up{job="ups"}[5m]))' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  # Chain metrics from the geth node servers (agents/chain/), sent to
  # #block-update (policies.yml, label source=chain). Each rule is A
  # (Prometheus, instant) -> B (last value per series) -> C (threshold on B);
  # the message shows B. Blocks come about every 14 s.
  - orgId: 1
    name: chain
    folder: Chain
    interval: 1m
    rules:
      # No node has seen a new block for 10 minutes (about 40 blocks). With
      # one of the two miners down the mean block time doubles, and a
      # 10-minute gap is still about e^-21 unlikely. One alert for the chain,
      # not per host. No data (no node answers) is "Chain RPC down" or
      # "Chain metrics missing".
      - uid: chain-stalled
        title: Chain stalled
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: chain }
        annotations:
          value_meaning: "s since the newest block on any node (limit 600)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'time() - max(cointmu_chain_head_timestamp_seconds{job="chain"})' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [600] } }]

      # A node without peers mines or follows alone. A geth restart passes
      # through 0 peers for well under 5 minutes.
      - uid: chain-peers-zero
        title: Chain node has no peers
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: chain }
        annotations:
          value_meaning: "peers"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'min by (host, role) (cointmu_chain_peers{job="chain"})' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # Blocks behind the node with the highest head. The nodes are sampled at
      # different moments, so 1-2 blocks is normal; 10 for 5 minutes is a node
      # that stopped importing or follows a fork.
      - uid: chain-node-behind
        title: Chain node behind
        condition: C
        for: 5m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: chain }
        annotations:
          value_meaning: "blocks behind the highest node (limit 10)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                max by (host, role) (scalar(max(cointmu_chain_head_block{job="chain"}))
                - cointmu_chain_head_block{job="chain"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [10] } }]

      # geth's RPC does not answer: geth stopped, crashed or hangs. Then that
      # node's head series stop, so "behind" and "stalled" cannot see it; this
      # rule does. A soft PM2 restart takes about a minute.
      - uid: chain-rpc-down
        title: Chain RPC down
        condition: C
        for: 3m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: chain }
        annotations:
          value_meaning: "(0 = the node's RPC does not answer)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, range: false, expr: 'min by (host, role) (cointmu_chain_rpc_up{job="chain"})' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      # Fresh scrapes of old content: chain-metrics.py or its timer stopped,
      # and Alloy keeps sending the last file. Same expression as "UPS metrics
      # stale": during a network or Alloy outage the difference stays small,
      # so only "Chain metrics missing" fires then.
      - uid: chain-metrics-stale
        title: Chain metrics stale
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: chain }
        annotations:
          value_meaning: "s between the scrape and the file's content (limit 60)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                max by (host, role) (timestamp(cointmu_chain_scrape_timestamp_seconds{job="chain"})
                - cointmu_chain_scrape_timestamp_seconds{job="chain"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [60] } }]

      # A node that sent chain metrics in the last 24 hours but not in the
      # last 5 minutes: the node, its Alloy, or the network to this VM is down,
      # or the push is refused. Per node, like "Host silent", so one node of
      # three going away fires. A node shut down on purpose keeps it firing
      # for a day: silence it (RUNBOOK.md). Nothing fires before a node's
      # first sample.
      - uid: chain-metrics-missing
        title: Chain metrics missing
        condition: C
        for: 0m
        noDataState: OK
        execErrState: KeepLast
        labels: { source: chain }
        annotations:
          value_meaning: "s since the node's last metrics (none in 5 min)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                (time() - max by (host, role) (last_over_time(cointmu_chain_scrape_timestamp_seconds{job="chain"}[24h])))
                unless max by (host, role) (last_over_time(cointmu_chain_scrape_timestamp_seconds{job="chain"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0] } }]
