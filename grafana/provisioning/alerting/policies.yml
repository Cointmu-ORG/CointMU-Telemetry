# Rules labelled source=ups go to #ups, source=chain to #block-update,
# everything else (the log rules) to #node-logs; one message per rule and host
# (and UPS or role). A firing alert is repeated at most
# every 12 hours; resolving it sends one message.
apiVersion: 1
policies:
  - orgId: 1
    receiver: discord-node-logs
    group_by: [alertname, host]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: discord-ups
        object_matchers: [[source, =, ups]]
        group_by: [alertname, host, ups]
      - receiver: discord-chain
        object_matchers: [[source, =, chain]]
        group_by: [alertname, host, role]
